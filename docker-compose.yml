services:
  calendar:
    build: .
    ports:
      - "5000:5000"
    volumes:
      # Persist the SQLite database across container restarts
      - ./instance:/app/instance
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - pi-services

# =============================================================
# NETWORKS
# =============================================================
# Create this network once: docker network create pi-services
networks:
  pi-services:
    external: true
